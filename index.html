<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nor - Full Page Replica</title>
    <style>
        /* 全局重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ================= 顶部导航栏 ================= */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 80px;
            padding: 0 40px;
            border-bottom: 1px solid #000000;
            background-color: #fff;
            flex-shrink: 0; /* 防止被压缩 */
        }

        .logo-section {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .logo-icon {
            height: 50px;
            width: auto;
            margin-right: 15px;
        }

        .logo-text {
            font-size: 32px;
            font-weight: 800;
            color: #3b4cca;
            letter-spacing: 0.5px;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            text-decoration: none;
            font-size: 28px;
            font-weight: 700;
            color: #3b4cca;
        }

        .nav-links a:hover {
            opacity: 0.8;
        }

        /* ================= 主体内容区 ================= */
        .main-content {
            flex: 1; /* 关键：占据剩余全部高度，将页脚推到最底部 */
            padding: 20px 20px 0 20px; /* 左右和上留白 */
            display: flex;
            flex-direction: column;
            gap: 20px; /* 上下两大行之间的间距 */
        }

        /* 每一行布局 */
        .row {
            display: flex;
            gap: 20px; /* 格子之间的间距 */
        }

        /* 第一行：左大(占约58%)，中、右(各占约21%) */
        .row-top .box-large {
            flex: 5.5;
        }
        .row-top .box-small {
            flex: 2;
        }

        /* 第二行：左小(占约22%)，中(占约55%)，右窄(占约23%) */
        .row-bottom .box-small {
            flex: 2.2;
        }
        .row-bottom .box-large {
            flex: 5.5;
        }
        .row-bottom .box-narrow {
            flex: 2.3;
        }

        /* 方块通用样式 */
        .box {
            border: 4px solid #000000; /* 粗黑边框，还原图片风格 */
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* 防止图片溢出 */
        }

        /* 方框内的链接 */
        .box a {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 方框内的图片（保持比例不变，填满容器） */
        .box img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover; /* 关键：保持比例裁剪填满，不拉伸变形 */
        }

        /* 为了让第二行高度更接近原图，给第二行设置一个比例高度 */
        .row-bottom {
            flex: 1.2; /* 底部行稍微高一点 */
        }
        .row-top {
            flex: 1;
        }


        /* ================= 底部 Footer (版权 + 语言) ================= */
        .footer {
            padding: 10px 40px 20px 20px; /* 微调对齐 */
            display: flex;
            flex-direction: column;
            gap: 5px;
            background-color: #fff;
            flex-shrink: 0; /* 防止被压缩 */
        }

        /* 版权信息 */
        .copyright {
            font-size: 24px;
            font-weight: 800;
            color: #3b4cca;
            letter-spacing: 1px;
        }

        /* 语言选择行 */
        .language-selector {
            font-size: 16px;
            font-weight: 700;
            color: #000000;
            display: flex;
            align-items: center;
            gap: 6px; /* 单词之间的间距 */
        }

        .language-selector .label {
            margin-right: 4px;
        }

        /* 语言链接样式 */
        .language-selector a {
            text-decoration: none;
            color: #000000;
        }
        
        .language-selector a:hover {
            color: #3b4cca;
            text-decoration: underline;
        }

    </style>
</head>
<body>

    <!-- 导航栏 -->
    <header class="navbar">
        <div class="logo-section">
            <img src="logo.png" alt="Nor Logo" class="logo-icon">
            <span class="logo-text">Nor</span>
        </div>
        <nav class="nav-links">
            <a href="#">更多</a>
            <a href="#">发现</a>
            <a href="#">关于</a>
        </nav>
    </header>

    <!-- 主体内容区 -->
    <main class="main-content">
        <!-- 第一行 -->
        <div class="row row-top">
            <div class="box box-large">
                <a href="https://coming.nor.asia/%E6%B5%8B%E8%AF%95%E6%96%B0%E9%97%BB"><img src="https://ys-c.ysepan.com/wap/yangrenhyx/Midl9F9jH7C5b99/yc6gA7Iq4jBgGPa44s3jcgc3fS1ke3/fiFs80olu.jpeg" alt="Image 1"></a>
            </div>
            <div class="box box-small">
                <a href="#"><img src="&" alt="Image 2"></a>
            </div>
            <div class="box box-small">
                <a href="#"><img src="&" alt="Image 3"></a>
            </div>
        </div>

        <!-- 第二行 -->
        <div class="row row-bottom">
            <div class="box box-small">
                <a href="#"><img src="&" alt="Image 4"></a>
            </div>
            <div class="box box-large">
                <a href="#"><img src="&" alt="Image 5"></a>
            </div>
            <div class="box box-narrow">
                <a href="#"><img src="&" alt="Image 6"></a>
            </div>
        </div>
    </main>

    <!-- 底部信息栏 -->
    <footer class="footer">
        <!-- 版权信息 -->
        <div class="copyright">©NorStudio 2026</div>
        
        <!-- 语言选择 -->
        <div class="language-selector">
            <span class="label">选择语言</span>
            <a href="￥">EN</a>
            <a href="￥">CN</a>
            <a href="￥">FR</a>
            <a href="￥">JP</a>
        </div>
    </footer>

</body>
</html>
