<!DOCTYPE html>
<html lang="zh-CN" class="sd-theme-docs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nortbook Word 编辑器</title>
    <link href="https://cdn.jsdelivr.net/npm/superdoc/dist/style.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            font-family: "Segoe UI", Arial, sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            background: #f3f3f3;
            overflow: hidden;
        }

        /* ============ notb 导航栏 ============ */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 48px;
            padding: 0 24px;
            border-bottom: 1px solid #e0e0e0;
            background: #fff;
            flex-shrink: 0;
        }
        .logo-text { font-size: 18px; font-weight: 900; color: #3b4cca; }
        .nav-links { display: flex; gap: 24px; }
        .nav-links a {
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            transition: color 0.2s;
        }
        .nav-links a:hover { color: #000; }

        /* ============ 文件操作栏 ============ */
        .file-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            background: #fafafa;
            border-bottom: 1px solid #e0e0e0;
            flex-shrink: 0;
        }
        .file-bar button {
            padding: 4px 12px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
            color: #333;
            transition: background 0.15s;
        }
        .file-bar button:hover { background: #f0f0f0; }
        .file-bar .spacer { flex: 1; }
        .file-bar .status { font-size: 11px; color: #888; }

        /* ============ SuperDoc 工具栏容器：限制高度，超出滚动 ============ */
        #toolbar {
            background: #fff;
            border-bottom: 1px solid #e0e0e0;
            flex-shrink: 0;
            padding: 2px 6px;
            min-height: 36px;
            max-height: 96px;         /* 最多两行，超出滚动，避免过大 */
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* ============ 编辑器区域：关键修复 ============ */
        #editor {
            flex: 1;
            min-height: 0;            /* flex 子项必须加，否则内部滚动失败 */
            overflow: auto;
            background: #e8eaed;
            position: relative;
        }

        /* ============================================
           精细化压缩 SuperDoc 工具栏按钮尺寸
           ============================================ */
        .superdoc-toolbar {
            gap: 1px !important;
            flex-wrap: wrap !important;
            row-gap: 2px !important;
        }

        /* 按钮本体 */
        .superdoc-toolbar button,
        .superdoc-toolbar .toolbar-button {
            padding: 2px 5px !important;
            height: 26px !important;
            min-width: 26px !important;
            font-size: 12px !important;
            line-height: 1 !important;
            border-radius: 3px !important;
        }

        /* 按钮内 SVG 图标 */
        .superdoc-toolbar button svg,
        .superdoc-toolbar .toolbar-button svg {
            width: 14px !important;
            height: 14px !important;
        }

        /* 下拉菜单（字体、字号等） */
        .superdoc-toolbar select,
        .superdoc-toolbar .dropdown-toggle,
        .superdoc-toolbar [class*="select"] {
            height: 26px !important;
            padding: 1px 4px !important;
            font-size: 12px !important;
            min-width: 64px !important;
            max-width: 120px !important;
        }

        /* 分隔线、组间距 */
        .superdoc-toolbar .separator,
        .superdoc-toolbar [class*="divider"] {
            margin: 0 2px !important;
        }

        /* 颜色按钮的色块缩小 */
        .superdoc-toolbar [class*="color"] [class*="swatch"] {
            width: 12px !important;
            height: 12px !important;
        }

        /* 若 SuperDoc 内部有 padding 过大的区域，一并压小 */
        .superdoc-toolbar > * {
            margin: 0 !important;
        }

        /* 隐藏可能存在的“格式标记”等占位大块 */
        .superdoc-toolbar [class*="ruler"] {
            display: none !important;
        }

        /* 手机端进一步压缩 */
        @media (max-width: 768px) {
            .navbar { flex-direction: column; height: auto; padding: 8px 12px; gap: 6px; }
            .logo-text { font-size: 16px; }
            .nav-links { gap: 16px; }
            .nav-links a { font-size: 13px; }
            .file-bar { padding: 3px 8px; gap: 4px; }
            .file-bar button { padding: 3px 8px; font-size: 11px; }
            #toolbar { max-height: 80px; }
            .superdoc-toolbar button,
            .superdoc-toolbar .toolbar-button {
                height: 24px !important;
                min-width: 24px !important;
                padding: 1px 4px !important;
            }
        }
    </style>
</head>
<body>

    <!-- notb 导航栏 -->
    <header class="navbar">
        <span class="logo-text">Nortbook</span>
        <nav class="nav-links">
            <a href="#">更多</a>
            <a href="#">发现</a>
            <a href="#">关于</a>
        </nav>
    </header>

    <!-- 文件操作栏 -->
    <div class="file-bar">
        <button id="newBtn">新建</button>
        <button id="openBtn">打开 .docx</button>
        <button id="saveBtn">导出 .docx</button>
        <span class="spacer"></span>
        <span class="status" id="statusText">就绪</span>
        <input type="file" id="fileInput" accept=".docx" style="display: none;" />
    </div>

    <!-- SuperDoc 工具栏容器 -->
    <div id="toolbar"></div>

    <!-- 编辑器挂载点 -->
    <div id="editor"></div>

    <!-- SuperDoc CDN -->
    <script src="https://cdn.jsdelivr.net/npm/superdoc/dist/superdoc.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@superdoc-dev/fonts/dist/superdoc-fonts.min.js"></script>

    <script>
    (function () {
        var superdoc = null;
        var statusText = document.getElementById('statusText');

        function setStatus(msg) {
            statusText.textContent = msg;
        }

        function initEditor(file) {
            // 销毁旧实例
            if (superdoc && typeof superdoc.destroy === 'function') {
                try { superdoc.destroy(); } catch (e) {}
            }
            document.getElementById('editor').innerHTML = '';
            document.getElementById('toolbar').innerHTML = '';

            var config = {
                selector: '#editor',
                toolbar: '#toolbar',
                documentMode: 'editing',
                pagination: true,
                rulers: false,          // 关闭标尺，减少占用
                // 只显示核心按钮，避免工具栏过长（可按需增删）
                toolbarGroups: [
                    'left',
                    'center',
                    'right'
                ]
            };

            // 字体包
            if (typeof SuperDocFonts !== 'undefined' && SuperDocFonts.superdocFonts) {
                config.fonts = SuperDocFonts.superdocFonts;
            }

            if (file) config.document = file;

            try {
                superdoc = new SuperDoc(config);
                superdoc.onReady = function () {
                    setStatus('编辑器已就绪');
                    // 强制再压缩一次（防止样式被延迟加载覆盖）
                    compressToolbar();
                };
            } catch (err) {
                console.error('SuperDoc 初始化失败：', err);
                setStatus('初始化失败：' + err.message);
            }
        }

        // 二次压缩工具栏（针对运行时生成的元素）
        function compressToolbar() {
            var toolbar = document.getElementById('toolbar');
            if (!toolbar) return;
            toolbar.querySelectorAll('button').forEach(function (btn) {
                btn.style.padding = '2px 5px';
                btn.style.height = '26px';
                btn.style.minWidth = '26px';
                btn.style.fontSize = '12px';
                btn.style.lineHeight = '1';
            });
            toolbar.querySelectorAll('svg').forEach(function (svg) {
                svg.setAttribute('width', '14');
                svg.setAttribute('height', '14');
                svg.style.width = '14px';
                svg.style.height = '14px';
            });
            toolbar.querySelectorAll('select').forEach(function (sel) {
                sel.style.height = '26px';
                sel.style.fontSize = '12px';
                sel.style.padding = '1px 4px';
            });
        }

        // ============ 按钮事件 ============
        document.getElementById('newBtn').addEventListener('click', function () {
            initEditor(null);
            setStatus('新建空白文档');
        });

        var fileInput = document.getElementById('fileInput');
        document.getElementById('openBtn').addEventListener('click', function () {
            fileInput.click();
        });
        fileInput.addEventListener('change', function (e) {
            var file = e.target.files[0];
            if (!file) return;
            initEditor(file);
            setStatus('已加载：' + file.name);
            fileInput.value = '';
        });

        document.getElementById('saveBtn').addEventListener('click', async function () {
            if (!superdoc) { alert('编辑器尚未就绪'); return; }
            try {
                setStatus('正在导出...');
                var blob = await superdoc.export({ triggerDownload: false });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = 'Nortbook_Document.docx';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                setStatus('导出完成');
            } catch (err) {
                console.error('导出失败：', err);
                setStatus('导出失败');
                alert('导出失败，请查看控制台。');
            }
        });

        // 页面加载完成后初始化
        window.addEventListener('load', function () {
            initEditor(null);
        });
    })();
    </script>
</body>
</html>
