<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nor 地图</title>
    <style>
        /* 全局重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ================= 顶部导航栏 ================= */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 80px;
            padding: 0 40px;
            border-bottom: 1px solid #000000;
            background-color: #fff;
            flex-shrink: 0;
            z-index: 1000;
        }

        .logo-section {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .logo-icon {
            height: 50px;
            width: auto;
            margin-right: 15px;
        }

        .logo-text {
            font-size: 32px;
            font-weight: 800;
            color: #3b4cca;
            letter-spacing: 0.5px;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            text-decoration: none;
            font-size: 28px;
            font-weight: 700;
            color: #3b4cca;
        }

        .nav-links a:hover {
            opacity: 0.8;
        }

        /* ================= 地图主体区 ================= */
        .main-content {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        /* 地图容器：占满剩余区域 */
        #mapContainer {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* ================= 手机端适配 ================= */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                height: auto;
                padding: 12px 16px;
                gap: 8px;
            }

            .logo-icon {
                height: 36px;
                margin-right: 10px;
            }

            .logo-text {
                font-size: 24px;
            }

            .nav-links {
                gap: 18px;
            }

            .nav-links a {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <!-- 导航栏 -->
    <header class="navbar">
        <div class="logo-section">
            <img src="logo.png" alt="Nor Logo" class="logo-icon" onerror="this.style.display='none'">
            <span class="logo-text">Nor 地图</span>
        </div>
        <nav class="nav-links">
            <a href="#">更多</a>
            <a href="#">发现</a>
            <a href="#">关于</a>
        </nav>
    </header>

    <!-- 地图主体区 -->
    <main class="main-content">
        <div id="mapContainer"></div>
    </main>

    <!-- 天地图 API -->
    <script src="https://api.tianditu.gov.cn/api?v=4.0&tk=de89a318d0048054a421933a2bf0d014"></script>
    <script>
        // 初始化天地图
        function initMap() {
            // 检查 API 是否加载成功
            if (typeof T === 'undefined') {
                console.error('天地图 API 加载失败，请检查网络或密钥。');
                return;
            }

            // 创建地图实例
            const map = new T.Map('mapContainer');

            // 设置中心点（默认北京天安门：116.397, 39.908）和缩放级别
            const centerPoint = new T.LngLat(116.397, 39.908);
            map.centerAndZoom(centerPoint, 12);

            // 启用鼠标滚轮缩放
            map.enableScrollWheelZoom();

            // 添加地图类型控件（右上角）
            const ctrl = new T.Control.MapType();
            ctrl.setPosition(T_ANCHOR_TOP_RIGHT);
            map.addControl(ctrl);

            // 添加缩放控件（左上角）
            const zoomCtrl = new T.Control.Zoom();
            zoomCtrl.setPosition(T_ANCHOR_TOP_LEFT);
            map.addControl(zoomCtrl);

            // 添加比例尺控件（左下角）
            const scaleCtrl = new T.Control.Scale();
            scaleCtrl.setPosition(T_ANCHOR_BOTTOM_LEFT);
            map.addControl(scaleCtrl);
        }

        // 页面加载完成后初始化地图
        window.addEventListener('load', initMap);
    </script>

</body>
</html>
