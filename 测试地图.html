<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nor Map - 地图工具</title>
    <style>
        /* 全局重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
            background-color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ================= 顶部导航栏 ================= */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 64px;
            padding: 0 28px;
            border-bottom: 1px solid #000000;
            background-color: #fff;
            flex-shrink: 0;
            z-index: 10;
        }

        .logo-section {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .logo-icon {
            height: 36px;
            width: auto;
            margin-right: 10px;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 800;
            color: #3b4cca;
            letter-spacing: 0.5px;
        }

        .nav-links {
            display: flex;
            gap: 24px;
        }

        .nav-links a {
            text-decoration: none;
            font-size: 18px;
            font-weight: 700;
            color: #3b4cca;
            transition: opacity 0.2s;
        }

        .nav-links a:hover {
            opacity: 0.7;
        }

        /* ================= 主体内容区：地图 ================= */
        .main-content {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #mapContainer {
            width: 100%;
            height: 100%;
            background-color: #f0f0f0;
        }

        /* ================= 底部状态栏 ================= */
        .footer {
            padding: 8px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #fff;
            flex-shrink: 0;
            border-top: 1px solid #000000;
            font-size: 13px;
            color: #555555;
            gap: 16px;
            flex-wrap: wrap;
        }

        .copyright {
            font-size: 14px;
            font-weight: 700;
            color: #3b4cca;
            letter-spacing: 0.5px;
        }

        .map-info {
            font-weight: 500;
            color: #888888;
        }

        /* 地图控件微调 */
        .BMap_cpyCtrl,
        .anchorBL {
            display: none !important;
        }

        /* ================= 手机端适配 ================= */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                height: auto;
                padding: 10px 14px;
                gap: 8px;
            }

            .logo-icon {
                height: 28px;
                margin-right: 8px;
            }

            .logo-text {
                font-size: 20px;
            }

            .nav-links {
                gap: 16px;
            }

            .nav-links a {
                font-size: 15px;
            }

            .footer {
                padding: 6px 14px;
                font-size: 11px;
            }

            .copyright {
                font-size: 12px;
            }
        }

    </style>
</head>
<body>

    <!-- 导航栏 -->
    <header class="navbar">
        <div class="logo-section">
            <img src="logo.png" alt="Nor Logo" class="logo-icon" onerror="this.style.display='none'">
            <span class="logo-text">Nor Map</span>
        </div>
        <nav class="nav-links">
            <a href="#">更多</a>
            <a href="#">发现</a>
            <a href="#">关于</a>
        </nav>
    </header>

    <!-- 主体内容区：地图 -->
    <main class="main-content">
        <div id="mapContainer"></div>
    </main>

    <!-- 底部状态栏 -->
    <footer class="footer">
        <div class="copyright">©NorStudio 2026</div>
        <div class="map-info" id="mapInfo">天地图 · 加载中...</div>
    </footer>

    <!-- 天地图 API：引入 JS（key=您的密钥） -->
    <script src="https://api.tianditu.gov.cn/api?v=4.0&tk=de89a318d0048054a421933a2bf0d014"></script>

    <!-- 初始化地图 -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const mapInfo = document.getElementById('mapInfo');

            // 等待天地图 API 加载完成
            if (typeof T === 'undefined') {
                mapInfo.textContent = '天地图 API 加载失败，请检查网络或密钥';
                console.error('天地图 API 未加载成功');
                return;
            }

            try {
                // 初始化地图，默认中心点：北京天安门，缩放级别 12
                const map = new T.Map('mapContainer');
                map.centerAndZoom(new T.LngLat(116.397128, 39.916527), 12);

                // 添加缩放控件
                map.addControl(new T.Control.Zoom({
                    position: T_ANCHOR_TOP_RIGHT
                }));

                // 添加比例尺控件
                map.addControl(new T.Control.Scale({
                    position: T_ANCHOR_BOTTOM_LEFT
                }));

                // 添加地图类型控件（普通地图 / 卫星）
                map.addControl(new T.Control.MapType({
                    position: T_ANCHOR_TOP_RIGHT
                }));

                // 开启鼠标滚轮缩放
                map.enableScrollWheelZoom();

                // 开启双击放大
                map.enableDoubleClickZoom();

                // 添加默认标记（北京天安门）
                const marker = new T.Marker(new T.LngLat(116.397128, 39.916527));
                map.addOverLay(marker);

                // 点击地图获取坐标
                map.addEventListener('click', (e) => {
                    const lng = e.lnglat.getLng().toFixed(6);
                    const lat = e.lnglat.getLat().toFixed(6);
                    mapInfo.textContent = `经度：${lng}  纬度：${lat}`;
                });

                // 加载完成提示
                mapInfo.textContent = '天地图 · 点击地图获取坐标';

                // 监听地图缩放，实时显示当前缩放级别
                map.addEventListener('zoomend', () => {
                    const zoom = map.getZoom();
                    // 保持原提示或显示缩放级别
                    console.log('当前缩放级别：', zoom);
                });

            } catch (error) {
                console.error('地图初始化失败：', error);
                mapInfo.textContent = '地图初始化失败，请刷新页面重试';
            }
        });
    </script>

</body>
</html>
