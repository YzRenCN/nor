<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nor 地图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ================= 顶部导航栏 ================= */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 80px;
            padding: 0 40px;
            border-bottom: 1px solid #000000;
            background-color: #fff;
            flex-shrink: 0;
            z-index: 1000;
        }

        .logo-section {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .logo-icon {
            height: 50px;
            width: auto;
            margin-right: 15px;
        }

        .logo-text {
            font-size: 32px;
            font-weight: 800;
            color: #3b4cca;
            letter-spacing: 0.5px;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            text-decoration: none;
            font-size: 28px;
            font-weight: 700;
            color: #3b4cca;
        }

        .nav-links a:hover {
            opacity: 0.8;
        }

        /* ================= 地图选择栏 ================= */
        .map-selector {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 40px;
            background-color: #f8f8ff;
            border-bottom: 1px solid #eaeaea;
            flex-shrink: 0;
        }

        .map-selector label {
            font-size: 18px;
            font-weight: 700;
            color: #3b4cca;
            letter-spacing: 0.5px;
        }

        .map-selector select {
            font-family: inherit;
            font-size: 18px;
            font-weight: 700;
            color: #000000;
            padding: 8px 16px;
            border: 3px solid #000000;
            border-radius: 6px;
            background-color: #ffffff;
            cursor: pointer;
            transition: all 0.15s ease;
            outline: none;
            min-width: 220px;
        }

        .map-selector select:hover {
            border-color: #3b4cca;
        }

        .map-selector select:focus {
            border-color: #3b4cca;
            box-shadow: 3px 3px 0px #3b4cca;
        }

        /* ================= 地图主体区 ================= */
        .main-content {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        /* 所有地图容器默认隐藏，只有 active 的显示 */
        .map-container {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .map-container.active {
            display: block;
        }

        /* ================= 手机端适配 ================= */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                height: auto;
                padding: 12px 16px;
                gap: 8px;
            }

            .logo-icon {
                height: 36px;
                margin-right: 10px;
            }

            .logo-text {
                font-size: 24px;
            }

            .nav-links {
                gap: 18px;
            }

            .nav-links a {
                font-size: 18px;
            }

            .map-selector {
                padding: 10px 16px;
                gap: 10px;
            }

            .map-selector label {
                font-size: 15px;
            }

            .map-selector select {
                font-size: 15px;
                padding: 6px 12px;
                min-width: 160px;
            }
        }
    </style>
</head>
<body>

    <!-- 导航栏 -->
    <header class="navbar">
        <div class="logo-section">
            <img src="logo.png" alt="Nor Logo" class="logo-icon" onerror="this.style.display='none'">
            <span class="logo-text">Nor 地图</span>
        </div>
        <nav class="nav-links">
            <a href="#">更多</a>
            <a href="#">发现</a>
            <a href="#">关于</a>
        </nav>
    </header>

    <!-- 地图选择栏 -->
    <div class="map-selector">
        <label for="mapSelect">选择地图：</label>
        <select id="mapSelect">
            <option value="tianditu">天地图</option>
            <option value="osm">OpenStreetMap</option>
            <option value="maplibre">MapLibre</option>
        </select>
    </div>

    <!-- 地图主体区 -->
    <main class="main-content">
        <div id="tiandituMap" class="map-container active"></div>
        <div id="osmMap" class="map-container"></div>
        <div id="maplibreMap" class="map-container"></div>
    </main>

    <!-- 天地图 API -->
    <script src="https://api.tianditu.gov.cn/api?v=4.0&tk=de89a318d0048054a421933a2bf0d014"></script>

    <!-- OpenStreetMap 使用 Leaflet 作为地图库 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- MapLibre GL JS -->
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />

    <script>
        window.addEventListener('load', function () {

            // 中心点：北京天安门
            var centerLng = 116.397;
            var centerLat = 39.908;

            // ================= 1. 天地图 =================
            var tdtMap = null;
            if (typeof T !== 'undefined') {
                tdtMap = new T.Map('tiandituMap');
                tdtMap.centerAndZoom(new T.LngLat(centerLng, centerLat), 12);
                tdtMap.enableScrollWheelZoom();
            } else {
                console.warn('天地图 API 未加载');
            }

            // ================= 2. OpenStreetMap（Leaflet） =================
            var osmMap = L.map('osmMap', {
                center: [centerLat, centerLng],
                zoom: 12,
                zoomControl: true
            });

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors',
                maxZoom: 19
            }).addTo(osmMap);

            // ================= 3. MapLibre GL JS =================
            var maplibreMap = new maplibregl.Map({
                container: 'maplibreMap',
                style: {
                    version: 8,
                    sources: {
                        'osm-tiles': {
                            type: 'raster',
                            tiles: [
                                'https://tile.openstreetmap.org/{z}/{x}/{y}.png'
                            ],
                            tileSize: 256,
                            attribution: '© OpenStreetMap contributors'
                        }
                    },
                    layers: [
                        {
                            id: 'osm-layer',
                            type: 'raster',
                            source: 'osm-tiles',
                            minzoom: 0,
                            maxzoom: 19
                        }
                    ]
                },
                center: [centerLng, centerLat],
                zoom: 12
            });

            // ================= 地图切换逻辑 =================
            var select = document.getElementById('mapSelect');
            var containers = {
                tianditu: document.getElementById('tiandituMap'),
                osm: document.getElementById('osmMap'),
                maplibre: document.getElementById('maplibreMap')
            };

            select.addEventListener('change', function () {
                var selected = this.value;

                // 隐藏所有地图容器
                Object.keys(containers).forEach(function (key) {
                    containers[key].classList.remove('active');
                });

                // 显示选中的地图容器
                containers[selected].classList.add('active');

                // 重新调整地图尺寸（因为容器从 display:none 变为显示后，地图需要重新计算尺寸）
                if (selected === 'tianditu' && tdtMap) {
                    // 天地图无需特殊处理，会自动适配
                } else if (selected === 'osm' && osmMap) {
                    setTimeout(function () {
                        osmMap.invalidateSize();
                    }, 50);
                } else if (selected === 'maplibre' && maplibreMap) {
                    setTimeout(function () {
                        maplibreMap.resize();
                    }, 50);
                }
            });

        });
    </script>

</body>
</html>
