<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Norws - Infinite News Aggregator</title>
    <style>
        /* Global Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ================= Top Navigation Bar ================= */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 80px;
            padding: 0 40px;
            border-bottom: 4px solid #000000;
            background-color: #fff;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo-section {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .logo-icon {
            height: 50px;
            width: auto;
            margin-right: 15px;
        }

        .logo-text {
            font-size: 32px;
            font-weight: 800;
            color: #3b4cca;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            text-decoration: none;
            font-size: 28px;
            font-weight: 700;
            color: #3b4cca;
            transition: opacity 0.2s;
        }

        .nav-links a:hover {
            opacity: 0.7;
        }

        /* ================= Main Content (News Grid) ================= */
        .main-content {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1600px;
        }

        .news-box {
            border: 4px solid #000000;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            aspect-ratio: 4 / 3; 
            position: relative;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }

        .news-box:hover {
            transform: translateY(-4px);
            box-shadow: 6px 6px 0px #000000;
        }

        .news-box-inner {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        .news-box img {
            display: block;
            width: 100%;
            height: 65%;
            object-fit: cover;
            border-bottom: 3px solid #000000;
            background-color: #f0f0f0;
        }

        .news-box .news-title {
            height: 35%;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            font-size: 14px;
            font-weight: 700;
            color: #000000;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            background-color: #ffffff;
        }

        /* ================= Load More Button ================= */
        .load-more-container {
            margin: 40px 0;
            text-align: center;
            width: 100%;
        }

        .load-more-btn {
            background-color: #3b4cca;
            color: #ffffff;
            font-size: 24px;
            font-weight: 800;
            padding: 15px 40px;
            border: 4px solid #000000;
            cursor: pointer;
            box-shadow: 6px 6px 0px #000000;
            transition: all 0.1s ease;
            text-transform: uppercase;
        }

        .load-more-btn:hover {
            background-color: #2a38a8;
        }

        .load-more-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 2px 2px 0px #000000;
        }

        .loading-state {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #3b4cca;
            padding: 50px 0;
        }

        /* ================= Footer ================= */
        .footer {
            padding: 10px 40px 20px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fff;
            flex-shrink: 0;
            border-top: 4px solid #000000;
        }

        .copyright {
            font-size: 24px;
            font-weight: 800;
            color: #3b4cca;
            letter-spacing: 1px;
        }

        /* ================= Modal (Popup Window) ================= */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background-color: #ffffff;
            border: 6px solid #000000;
            width: 100%;
            max-width: 700px;
            max-height: 90vh; /* Prevent overflow on tall screens */
            box-shadow: 10px 10px 0px #3b4cca;
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Hide scrollbars outside the content */
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-close {
            position: absolute;
            top: -25px;
            right: -25px;
            background-color: #3b4cca;
            color: white;
            border: 4px solid #000000;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 3px 3px 0px #000000;
            transition: all 0.1s ease;
            z-index: 10;
        }

        .modal-close:hover {
            background-color: #2a38a8;
        }
        .modal-close:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #000000;
        }

        .modal-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-bottom: 4px solid #000000;
            flex-shrink: 0;
        }

        .modal-body {
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto; /* Enable scrolling for long articles */
            flex: 1;
        }

        .modal-title {
            font-size: 26px;
            font-weight: 800;
            color: #000000;
            line-height: 1.3;
        }

        .modal-meta {
            font-size: 14px;
            font-weight: 600;
            color: #555555;
            border-bottom: 2px solid #eaeaea;
            padding-bottom: 10px;
        }

        .modal-article-content {
            font-size: 16px;
            line-height: 1.7;
            color: #333333;
        }

        .modal-article-content p {
            margin-bottom: 15px;
        }

        /* Loading Indicator inside Modal */
        .article-loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 0;
            font-size: 18px;
            font-weight: bold;
            color: #3b4cca;
            font-style: italic;
        }

    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <header class="navbar">
        <div class="logo-section">
            <img src="logo.png" alt="Norws Logo" class="logo-icon" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'50\' height=\'50\' viewBox=\'0 0 100 100\'><circle cx=\'50\' cy=\'50\' r=\'45\' fill=\'none\' stroke=\'%233b4cca\' stroke-width=\'8\'/><circle cx=\'70\' cy=\'30\' r=\'12\' fill=\'none\' stroke=\'%233b4cca\' stroke-width=\'8\'/></svg>'">
            <span class="logo-text">Norws</span>
        </div>
        <nav class="nav-links">
            <a href="#">More</a>
            <a href="#">Discover</a>
            <a href="#">About</a>
        </nav>
    </header>

    <!-- Main Content Area -->
    <main class="main-content">
        <div class="news-grid" id="newsGrid">
            <div class="loading-state">Fetching the latest news. Please wait...</div>
        </div>
        
        <div class="load-more-container">
            <button class="load-more-btn" id="loadMoreBtn" style="display: none;">+ Load More News</button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="copyright">©NorStudio 2026</div>
    </footer>

    <!-- Modal (Popup Window) Structure -->
    <div class="modal-overlay" id="newsModal">
        <div class="modal-content">
            <button class="modal-close" id="closeModalBtn">&times;</button>
            <img src="" alt="News Image" class="modal-image" id="modalImage">
            <div class="modal-body" id="modalBody">
                <div class="modal-title" id="modalTitle">News Title</div>
                <div class="modal-meta" id="modalMeta">Loading source...</div>
                <!-- Article content will be injected here -->
                <div class="modal-article-content" id="modalArticleContent">
                    <div class="article-loading">Loading article content...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Automation & Interaction Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const newsGrid = document.getElementById('newsGrid');
            const loadMoreBtn = document.getElementById('loadMoreBtn');
            const newsModal = document.getElementById('newsModal');
            const closeModalBtn = document.getElementById('closeModalBtn');
            
            const modalImage = document.getElementById('modalImage');
            const modalTitle = document.getElementById('modalTitle');
            const modalMeta = document.getElementById('modalMeta');
            const modalArticleContent = document.getElementById('modalArticleContent');

            const API_URL = 'https://hacker-news.firebaseio.com/v0/topstories.json';
            let allStoryIds = [];
            let currentIndex = 0;
            const BATCH_SIZE = 15;

            // Fetch top story IDs
            fetch(API_URL)
                .then(response => response.json())
                .then(storyIds => {
                    allStoryIds = storyIds;
                    newsGrid.innerHTML = ''; 
                    loadMoreBtn.style.display = 'inline-block'; 
                    loadNewsBatch(); 
                })
                .catch(error => {
                    console.error('Failed to fetch news list:', error);
                    newsGrid.innerHTML = '<div class="loading-state" style="color:red;">Failed to connect to news server.</div>';
                });

            // Load a batch of news
            function loadNewsBatch() {
                loadMoreBtn.disabled = true;
                loadMoreBtn.textContent = 'Loading...';

                const batchIds = allStoryIds.slice(currentIndex, currentIndex + BATCH_SIZE);
                currentIndex += BATCH_SIZE;

                if (batchIds.length === 0) {
                    loadMoreBtn.style.display = 'none';
                    return;
                }

                const fetchPromises = batchIds.map(id => 
                    fetch(`https://hacker-news.firebaseio.com/v0/item/${id}.json`)
                        .then(res => res.json())
                );

                Promise.all(fetchPromises)
                    .then(stories => {
                        stories.forEach(story => {
                            if (!story || !story.title) return;

                            const boxDiv = document.createElement('div');
                            boxDiv.className = 'news-box';
                            
                            boxDiv.dataset.id = story.id;
                            boxDiv.dataset.title = story.title;
                            boxDiv.dataset.url = story.url || `https://news.ycombinator.com/item?id=${story.id}`;
                            boxDiv.dataset.image = `https://picsum.photos/seed/${story.id}/800/600`;

                            const innerDiv = document.createElement('div');
                            innerDiv.className = 'news-box-inner';

                            const img = document.createElement('img');
                            img.src = `https://picsum.photos/seed/${story.id}/400/300`;
                            img.alt = story.title;

                            const titleDiv = document.createElement('div');
                            titleDiv.className = 'news-title';
                            titleDiv.textContent = story.title;

                            innerDiv.appendChild(img);
                            innerDiv.appendChild(titleDiv);
                            boxDiv.appendChild(innerDiv);
                            newsGrid.appendChild(boxDiv);

                            // Open modal on click
                            boxDiv.addEventListener('click', () => openModal(boxDiv.dataset));
                        });

                        loadMoreBtn.disabled = false;
                        loadMoreBtn.textContent = '+ Load More News';
                    })
                    .catch(error => {
                        console.error('Failed to load stories details:', error);
                        loadMoreBtn.disabled = false;
                        loadMoreBtn.textContent = '+ Load More News (Error)';
                    });
            }

            // Modal Logic
            function openModal(data) {
                modalImage.src = data.image;
                modalTitle.textContent = data.title;
                modalMeta.textContent = `Article ID: ${data.id} | Source: Hacker News`;
                modalArticleContent.innerHTML = '<div class="article-loading">Fetching full article content...</div>';
                
                newsModal.classList.add('active');
                document.body.style.overflow = 'hidden';

                // Attempt to fetch actual article content from the source URL
                if (data.url && data.url.startsWith('http')) {
                    fetch(data.url)
                        .then(response => {
                            if (!response.ok) throw new Error('Network response was not ok');
                            return response.text();
                        })
                        .then(html => {
                            const parser = new DOMParser();
                            const doc = parser.parseFromString(html, 'text/html');
                            
                            // Extract all paragraph texts
                            const paragraphs = Array.from(doc.querySelectorAll('p'))
                                .map(p => p.textContent.trim())
                                .filter(text => text.length > 40); // Filter out short/empty paragraphs

                            if (paragraphs.length > 0) {
                                // Take up to 8 solid paragraphs to keep the article readable
                                const extractedText = paragraphs.slice(0, 8).join('</p><p>');
                                modalArticleContent.innerHTML = `<p>${extractedText}</p>`;
                            } else {
                                throw new Error('No substantial paragraphs found');
                            }
                        })
                        .catch(error => {
                            // Fallback: Generate a simulated news article based on the title
                            console.warn('Could not fetch original article due to CORS or structure:', error);
                            const simulatedContent = generateSimulatedArticle(data.title);
                            modalArticleContent.innerHTML = simulatedContent;
                        });
                } else {
                    // Fallback for non-URL items (like Ask HN posts)
                    setTimeout(() => {
                        const simulatedContent = generateSimulatedArticle(data.title);
                        modalArticleContent.innerHTML = simulatedContent;
                    }, 500);
                }
            }

            // Generates a realistic-looking simulated article body when external fetch fails
            function generateSimulatedArticle(title) {
                const paragraphs = [
                    `<strong>${title}</strong> — This report examines the recent developments surrounding this topic and its broader implications.`,
                    `According to sources familiar with the matter, the situation has evolved significantly over the past few weeks. Industry experts suggest that the underlying factors driving these changes are complex and interconnected, requiring a multifaceted approach to fully comprehend.`,
                    `"We are witnessing a paradigm shift," one analyst noted. "The traditional frameworks we've relied upon are no longer sufficient to explain the current dynamics. Stakeholders across the board are being forced to adapt rapidly."`,
                    `The data indicates a clear trend that aligns with earlier predictions, though the scale of the impact has surprised many observers. This has led to renewed calls for comprehensive policy reviews and strategic adjustments at both the organizational and regulatory levels.`,
                    `Furthermore, the ripple effects are expected to be felt across multiple sectors in the coming months. Companies are already beginning to reassess their long-term strategies, prioritizing resilience and agility over rigid long-term planning.`,
                    `As the situation continues to unfold, it remains to be seen how key players will respond. What is certain, however, is that the decisions made in the coming weeks will have lasting consequences for years to come.`
                ];
                return paragraphs.map(p => `<p>${p}</p>`).join('');
            }

            function closeModal() {
                newsModal.classList.remove('active');
                document.body.style.overflow = '';
                modalArticleContent.innerHTML = ''; // Clear content
            }

            // Event Listeners
            loadMoreBtn.addEventListener('click', loadNewsBatch);
            closeModalBtn.addEventListener('click', closeModal);
            
            newsModal.addEventListener('click', (e) => {
                if (e.target === newsModal) {
                    closeModal();
                }
            });
        });
    </script>
</body>
</html>
